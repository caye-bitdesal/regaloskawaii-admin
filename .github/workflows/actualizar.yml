# Keeps the AliExpress products already in the production EmDash up to date
# (scripts/actualizar.mjs): price and price history, affiliate link, missing photo and
# priority, one write per product and only if something changed. Products the affiliate
# API no longer returns are unpublished (and republished if they come back).
#
# Runs every day at 03:41 UTC, or manually from GitHub → Actions → "Update products".
# Uses the same variable and secrets as "Import products":
#   EMDASH_URL, EMDASH_TOKEN, ALIEXPRESS_APP_KEY, ALIEXPRESS_APP_SECRET, ALIEXPRESS_TRACKING_ID
name: Update products

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulate only (writes nothing)"
        type: boolean
        default: false

# Never at the same time as an import (both write to EmDash).
concurrency:
  group: import-products
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EMDASH_URL: ${{ vars.EMDASH_URL }}
      EMDASH_TOKEN: ${{ secrets.EMDASH_TOKEN }}
      ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update products
        run: node scripts/actualizar.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
